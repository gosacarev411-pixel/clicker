<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Путь Бомжа - Telegram Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Модальное окно регистрации -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h2>Регистрация в игре</h2>
            <p>Введите имя вашего персонажа:</p>
            <input type="text" id="registerNameInput" placeholder="Кликуха...">
            <button id="registerBtn" class="btn">Начать путь</button>
        </div>
    </div>

    <!-- Главный экран игры -->
    <div id="gameScreen" class="screen">
        <!-- Шапка профиля -->
        <header class="header">
            <div class="user-info">
                <span id="displayName">Бомж</span>
                <span id="displayLevel" class="level-badge">Уровень 1: Бомж</span>
            </div>
            <div class="balances">
                <div class="balance-item">💰 <span id="displayMoney">0</span></div>
            </div>
        </header>

        <!-- Статистика и полоски -->
        <div class="stats-container">
            <p>Энергия: <span id="energyText">500</span>/500</p>
            <div class="bar-container"><div id="energyBar" class="bar" style="width: 100%;"></div></div>
            
            <p>Голод: <span id="hungerText">100</span>/100</p>
            <div class="bar-container"><div id="hungerBar" class="bar" style="width: 100%;"></div></div>
        </div>

        <!-- Центральный кликер -->
        <div class="clicker-section">
            <h2>Натапано денег</h2>
            <p>Сила тапа: +<span id="tapPower">1</span></p>
            <p>Пассивный доход: <span id="mineSpeed">0</span>/сек</p>
            
            <!-- Кнопка кликера (коробка) -->
            <div id="clickerBtn" class="clicker-box" style="cursor: pointer; text-align: center; margin: 20px 0;">
                <img src="box.png" alt="Коробка" style="width: 150px; height: 150px; object-fit: contain;">
            </div>
        </div>

        <!-- Нижнее меню навигации -->
        <nav class="footer-nav">
            <button onclick="openUpgrades()">🛒 Магазин</button>
            <button onclick="openSlots()">🎰 Слоты</button>
            <button onclick="openCases()">🎁 Кейсы</button>
            <button onclick="openWheel()">🎡 Колесо</button>
        </nav>
    </div>

    <!-- Модальное окно: Магазин улучшений -->
    <div id="upgradesModal" class="modal hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;">
        <div class="modal-content" style="background: #222; padding: 20px; border-radius: 10px; width: 300px; color: #fff;">
            <h2>Магазин улучшений</h2>
            <div id="upgradesContainer" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;"></div>
            <button onclick="closeAllSubScreens()">Закрыть</button>
        </div>
    </div>

    <!-- Модальное окно: Слоты (Казино) -->
    <div id="slotsModal" class="modal hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;">
        <div class="modal-content" style="background: #222; padding: 20px; border-radius: 10px; width: 300px; color: #fff; text-align: center;">
            <h2>Казино Слот</h2>
            <p>Ставка: <input type="number" id="slotBet" value="10" style="width: 60px;"></p>
            <div id="slotResult" style="font-size: 24px; margin: 15px 0;">🍒 | 🍋 | 🔔</div>
            <button onclick="spinSlots()" style="padding: 10px; margin-bottom: 10px;">Крутить!</button>

            <button onclick="closeAllSubScreens()">Закрыть</button>
        </div>
    </div>

    <!-- Модальное окно: Кейсы -->
    <div id="casesModal" class="modal hidden" style="positi


on: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;">
        <div class="modal-content" style="background: #222; padding: 20px; border-radius: 10px; width: 300px; color: #fff; text-align: center;">
            <h2>Кейс со скинами</h2>
            <p>Цена кейса: 500 монет</p>
            <p>Текущий скин: <span id="activeSkinText">Стандартная монета</span></p>
            <button onclick="openCase()" style="padding: 10px; margin-bottom: 10px;">Открыть кейс</button>

            <button onclick="closeAllSubScreens()">Закрыть</button>
        </div>
    </div>

    <!-- Подключаем наш JavaScript файл с логикой -->
    <script src="gamee.js"></script>
</body>
</html>
